<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMB Monthly Pass Mapper</title>
  <style>
    :root {
      --cm-green: #00d06c;
      --cm-dark-bg: #121212;
      --cm-card-bg: #1e1e1e;
      --cm-card-hover: #2a2a2a;
      --cm-text-main: #ffffff;
      --cm-text-sub: #a0a0a0;
      --kmb-red: #e2001a;
      --lwb-orange: #ff8000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--cm-dark-bg);
      color: var(--cm-text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Citymapper Header */
    header {
      background-color: #000;
      padding: 16px;
      border-bottom: 1px solid #222;
    }
    .search-box {
      background-color: var(--cm-card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.start { background-color: var(--cm-green); }
    .dot.end { background-color: var(--kmb-red); }
    input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      width: 100%;
      outline: none;
    }

    /* Route Cards Area */
    .container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .route-card {
      background-color: var(--cm-card-bg);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .route-card:hover { background-color: var(--cm-card-hover); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .duration {
      font-size: 22px;
      font-weight: 800;
      color: var(--cm-green);
    }
    .fare-tag {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background-color: rgba(0, 208, 108, 0.15);
      color: var(--cm-green);
    }

    /* Leg-by-leg badges */
    .route-legs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .badge-kmb { background-color: var(--kmb-red); }
    .badge-lwb { background-color: var(--lwb-orange); }
    .arrow { color: var(--cm-text-sub); font-size: 12px; }

    .pass-status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--cm-text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <div class="search-box">
      <div class="input-row">
        <span class="dot start"></span>
        <input type="text" placeholder="輸入起點..." value="荃威花園">
      </div>
      <div class="input-row" style="border-top: 1px solid #333; padding-top: 8px;">
        <span class="dot end"></span>
        <input type="text" placeholder="目的地..." value="尖沙咀碼頭">
      </div>
    </div>
  </header>

  <div class="container">
    <div class="route-card">
      <div class="card-header">
        <span class="duration">42 分鐘</span>
        <span class="fare-tag">月票 </span>
      </div>
      <div class="route-legs">
        <span class="badge badge-kmb">KMB 39A</span>
        <span class="arrow">➔</span>
        <span class="badge badge-kmb">KMB 234X</span>
      </div>
      <div class="pass-status">
        ✓ 100% 適用九巴月票（無限次搭乘）
      </div>
    </div>
  </div>

</body>
</html>
