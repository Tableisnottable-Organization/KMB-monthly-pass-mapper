<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMB Monthly Pass Mapper - Citymapper Style</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --cm-green: #00d06c;
      --cm-dark-bg: #121212;
      --cm-card-bg: #1e1e1e;
      --cm-card-hover: #2a2a2a;
      --cm-text-main: #ffffff;
      --cm-text-sub: #a0a0a0;
      --kmb-red: #e2001a;
      --lwb-orange: #ff8000;
      --mtr-red: #990000;
      --ctb-yellow: #f39c12;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--cm-dark-bg);
      color: var(--cm-text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #000;
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      z-index: 1000;
    }
    .search-container {
      background-color: var(--cm-card-bg);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot.start { background-color: var(--cm-green); }
    .dot.end { background-color: var(--kmb-red); }
    input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      width: 100%;
      outline: none;
    }

    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 110px);
    }
    .sidebar {
      width: 400px;
      background-color: var(--cm-dark-bg);
      border-right: 1px solid #222;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #map { flex: 1; height: 100%; background: #000; }

    .route-card {
      background-color: var(--cm-card-bg);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .route-card:hover {
      background-color: var(--cm-card-hover);
      border-color: #333;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .duration {
      font-size: 20px;
      font-weight: 800;
      color: var(--cm-green);
    }
    .score-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background-color: rgba(0, 208, 108, 0.15);
      color: var(--cm-green);
    }

    .route-legs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
    }
    .badge-kmb { background-color: var(--kmb-red); }
    .badge-lwb { background-color: var(--lwb-orange); }
    .badge-mtr { background-color: var(--mtr-red); }
    .badge-ctb { background-color: var(--ctb-yellow); color: #000; }
    .arrow { color: var(--cm-text-sub); font-size: 12px; }

    .score-breakdown {
      font-size: 12px;
      color: var(--cm-text-sub);
      line-height: 1.5;
      background-color: #121212;
      padding: 8px;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .main-layout { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 50%; }
      #map { height: 50%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="search-container">
      <div class="search-row">
        <span class="dot start"></span>
        <input type="text" id="start-input" placeholder="起點" value="荃威花園">
      </div>
      <div class="search-row" style="border-top: 1px solid #2a2a2a; padding-top: 6px;">
        <span class="dot end"></span>
        <input type="text" id="end-input" placeholder="目的地" value="中環">
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar" id="route-list"></div>
    <div id="map"></div>
  </div>

  <script>
    // UpgradedScoringEngine 評分引擎代碼
    class UpgradedScoringEngine {
      static getOperatorAdjustment(operator) {
        const adjustments = {
          'KMB': -1.0,
          'LWB': -0.46,
          'MTR': 0.5,
          'CTB': 1.0
        };
        return adjustments[operator] ?? 0;
      }

      static getTimeMultiplier(date = new Date()) {
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const timeInMin = hours * 60 + minutes;

        // 深夜 (23:00 - 05:50)
        if (timeInMin >= 1380 || timeInMin < 350) return 1.8;
        // 繁忙時間 (07:00-09:30 & 17:00-19:30)
        if ((timeInMin >= 420 && timeInMin <= 570) || (timeInMin >= 1020 && timeInMin <= 1170)) return 1.0;
        // 非繁忙時間
        return 1.3;
      }

      static calculateSegmentScore(segment, date = new Date()) {
        const segmentMultiplier = this.getTimeMultiplier(date);
        let etaComponent = 0;

        if (segment.realtimeEtaMinutes !== undefined && segment.isEtaFresh) {
          etaComponent = segment.realtimeEtaMinutes * segmentMultiplier;
        } else {
          const scheduledInterval = segment.scheduledIntervalMinutes ?? 12;
          etaComponent = scheduledInterval * 0.5 * segmentMultiplier;
        }

        const operatorAdjustment = this.getOperatorAdjustment(segment.operator);
        return segment.rideTimeMinutes + etaComponent + operatorAdjustment;
      }

      static calculateRouteScore(route, date = new Date()) {
        let legSubtotal = 0;
        route.segments.forEach(seg => {
          legSubtotal += this.calculateSegmentScore(seg, date);
        });

        const transferCount = Math.max(0, route.segments.length - 1);
        const transferPenalty = transferCount * 8;
        const walkTransferTime = route.walkTransferTimeMinutes || 0;
        const longDistanceSurcharge = route.longDistanceTransferSurcharge || 0;

        const finalScore = legSubtotal + walkTransferTime + longDistanceSurcharge + transferPenalty;

        return {
          finalScore: parseFloat(finalScore.toFixed(2)),
          legSubtotal: parseFloat(legSubtotal.toFixed(2)),
          transferPenalty,
          walkTransferTime,
          longDistanceSurcharge
        };
      }
    }

    // 地圖初始化
    const map = L.map('map').setView([22.3193, 114.1694], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd'
    }).addTo(map);

    // 測試數據
    const mockRoutes = [
      {
        id: 'route-1',
        segments: [
          { operator: 'KMB', routeName: '39A', rideTimeMinutes: 10, scheduledIntervalMinutes: 8, isEtaFresh: true, realtimeEtaMinutes: 3 },
          { operator: 'KMB', routeName: '234X', rideTimeMinutes: 30, scheduledIntervalMinutes: 10, isEtaFresh: true, realtimeEtaMinutes: 4 }
        ],
        walkTransferTimeMinutes: 3,
        longDistanceTransferSurcharge: 0
      },
      {
        id: 'route-2',
        segments: [
          { operator: 'MTR', routeName: '荃灣綫', rideTimeMinutes: 32, scheduledIntervalMinutes: 3, isEtaFresh: false }
        ],
        walkTransferTimeMinutes: 8,
        longDistanceTransferSurcharge: 5
      },
      {
        id: 'route-3',
        segments: [
          { operator: 'CTB', routeName: '930', rideTimeMinutes: 35, scheduledIntervalMinutes: 15, isEtaFresh: false }
        ],
        walkTransferTimeMinutes: 5,
        longDistanceTransferSurcharge: 0
      }
    ];

    function renderRoutes() {
      const sidebar = document.getElementById('route-list');
      sidebar.innerHTML = '';

      const scoredRoutes = mockRoutes.map(r => ({
        ...r,
        scoreInfo: UpgradedScoringEngine.calculateRouteScore(r)
      })).sort((a, b) => a.scoreInfo.finalScore - b.scoreInfo.finalScore);

      scoredRoutes.forEach((r, index) => {
        const card = document.createElement('div');
        card.className = 'route-card';

        let legsHtml = '';
        r.segments.forEach((seg, i) => {
          const badgeClass = adge-\;
          legsHtml += <span class="badge \">\ \</span>;
          if (i < r.segments.length - 1) legsHtml += '<span class="arrow">➔</span>';
        });

        card.innerHTML = 
          <div class="card-header">
            <span class="duration">\</span>
            <span class="score-tag">評分代價: \</span>
          </div>
          <div class="route-legs">\</div>
          <div class="score-breakdown">
            行程小計: \ 分 | 轉車懲罰: \ 分<br>
            步行負擔: \ 分 | 附加費: \ 分
          </div>
        ;
        sidebar.appendChild(card);
      });
    }

    renderRoutes();
  </script>
</body>
</html>
